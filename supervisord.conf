[supervisord]
nodaemon=true
user=root
logfile=/tmp/supervisord.log
logfile_maxbytes=50MB
pidfile=/tmp/supervisord.pid

[program:api]
command=uv run uvicorn app.main:app --host 0.0.0.0 --port 8000
directory=/app
autostart=true
autorestart=true
stdout_logfile=/tmp/api.stdout.log
stderr_logfile=/tmp/api.stderr.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB

[program:dashboard]
command=uv run streamlit run dashboard.py --server.port=7860 --server.address=0.0.0.0 --server.headless=true
directory=/app
autostart=true
autorestart=true
stdout_logfile=/tmp/dashboard.stdout.log
stderr_logfile=/tmp/dashboard.stderr.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
